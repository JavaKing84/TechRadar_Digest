[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-ai-science"
version = "1.0.0"
description = "AI 科技新闻机器人：Camoufox 抓正文 -> 中文标题 + 摘要 -> 飞书图文卡片"
requires-python = ">=3.11"
dependencies = [
    "camoufox>=0.5.0",
    "playwright>=1.40",
    "openai>=1.30",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F 是 pycodestyle+pyflakes 的核心集合：未使用导入、未定义名字、语法级问题
select = ["E", "F", "W", "I"]
ignore = ["E501"]
